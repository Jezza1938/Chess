<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chess">
  <meta name="theme-color" content="#1b1916">
  <title>Chess</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/chessground.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="board-brown pieces-cburnett">

  <!-- Home -->
  <section id="screen-home" class="screen active">
    <div class="home">
      <div class="logo"><piece class="white knight"></piece></div>
      <h1>Chess</h1>
      <p class="tagline">Works offline</p>
      <div class="home-buttons">
        <button class="big primary" id="btn-continue" hidden>
          <span class="big-title">Continue game</span>
          <span class="big-sub" id="continue-sub"></span>
        </button>
        <button class="big" id="btn-bot">
          <span class="big-title">Play vs Bot</span>
          <span class="big-sub">10 difficulty levels</span>
        </button>
        <button class="big" id="btn-pvp">
          <span class="big-title">2 Players</span>
          <span class="big-sub">Same device, with a tap clock</span>
        </button>
        <button class="big" id="btn-look">
          <span class="big-title">Boards &amp; Pieces</span>
          <span class="big-sub">10 boards, 10 piece sets, sounds</span>
        </button>
      </div>
      <p class="version" id="version"></p>
    </div>
  </section>

  <!-- Bot setup -->
  <section id="screen-bot" class="screen page">
    <header class="bar">
      <button class="back" data-go="home">‹ Back</button>
      <h1>Play vs Bot</h1>
      <span></span>
    </header>
    <div class="scroll">
      <div class="content">
        <h2>Difficulty</h2>
        <div class="levels" id="bot-levels"></div>
        <p class="level-desc" id="bot-level-desc"></p>

        <h2>Play as</h2>
        <div class="seg" id="bot-color">
          <button data-v="white"><piece class="white king"></piece>White</button>
          <button data-v="random"><span class="rand">?</span>Random</button>
          <button data-v="black"><piece class="black king"></piece>Black</button>
        </div>

        <h2>Time</h2>
        <div class="chips" id="bot-time-chips"></div>
        <div class="custom" id="bot-custom">
          <label>Minutes <input type="number" inputmode="decimal" min="0.5" max="180" step="0.5" id="bot-min"></label>
          <label>+ Seconds per move <input type="number" inputmode="numeric" min="0" max="60" step="1" id="bot-inc"></label>
        </div>
        <label class="toggle"><input type="checkbox" id="bot-clock"><span>Bot uses a clock too</span></label>
      </div>
    </div>
    <footer class="bar"><button class="primary wide" id="bot-start">Start game</button></footer>
  </section>

  <!-- 2 player setup -->
  <section id="screen-pvp" class="screen page">
    <header class="bar">
      <button class="back" data-go="home">‹ Back</button>
      <h1>2 Players</h1>
      <span></span>
    </header>
    <div class="scroll">
      <div class="content">
        <h2>Time</h2>
        <div class="chips" id="pvp-time-chips"></div>
        <div class="custom" id="pvp-custom">
          <label>Minutes <input type="number" inputmode="decimal" min="0.5" max="180" step="0.5" id="pvp-min"></label>
          <label>+ Seconds per move <input type="number" inputmode="numeric" min="0" max="60" step="1" id="pvp-inc"></label>
        </div>
        <label class="toggle"><input type="checkbox" id="pvp-split"><span>Different time for each player</span></label>
        <div class="split" id="pvp-split-box">
          <div class="split-row">
            <span class="split-name"><piece class="white king"></piece>White</span>
            <label>Minutes <input type="number" inputmode="decimal" min="0.5" max="180" step="0.5" id="pvp-w-min"></label>
            <label>+ Sec <input type="number" inputmode="numeric" min="0" max="60" step="1" id="pvp-w-inc"></label>
          </div>
          <div class="split-row">
            <span class="split-name"><piece class="black king"></piece>Black</span>
            <label>Minutes <input type="number" inputmode="decimal" min="0.5" max="180" step="0.5" id="pvp-b-min"></label>
            <label>+ Sec <input type="number" inputmode="numeric" min="0" max="60" step="1" id="pvp-b-inc"></label>
          </div>
        </div>

        <h2>Seating</h2>
        <label class="toggle"><input type="checkbox" id="pvp-face"><span>Face-to-face: turn Black's pieces to face the player across the table</span></label>

        <p class="note">After you make your move, tap your clock to start your opponent's time, just like a real chess clock.</p>
      </div>
    </div>
    <footer class="bar"><button class="primary wide" id="pvp-start">Start game</button></footer>
  </section>

  <!-- Appearance -->
  <section id="screen-look" class="screen page">
    <header class="bar">
      <button class="back" data-go="home">‹ Back</button>
      <h1>Boards &amp; Pieces</h1>
      <span></span>
    </header>
    <div class="scroll">
      <div class="content look">
        <div class="look-preview"><div id="look-board" class="cg-wrap"></div></div>
        <div class="look-options">
          <h2>Board</h2>
          <div class="tiles" id="board-tiles"></div>
          <h2>Pieces</h2>
          <div class="tiles" id="piece-tiles"></div>
          <h2>Options</h2>
          <label class="toggle"><input type="checkbox" id="opt-sound"><span>Sounds</span></label>
          <label class="toggle"><input type="checkbox" id="opt-dests"><span>Show legal moves</span></label>
          <label class="toggle"><input type="checkbox" id="opt-coords"><span>Show coordinates (a–h, 1–8)</span></label>
        </div>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen">
    <div class="player" id="p-top">
      <div class="pinfo">
        <div class="pname"></div>
        <div class="pcap"></div>
      </div>
      <button class="clock" type="button"><span class="ctime"></span><span class="ctap">TAP</span></button>
    </div>

    <div id="board-area">
      <div id="board" class="cg-wrap"></div>
      <div id="promo" class="board-overlay" hidden>
        <div class="promo-card">
          <p>Promote to</p>
          <div class="promo-choices"></div>
          <button class="ghost" id="promo-cancel">Cancel</button>
        </div>
      </div>
      <div id="paused" class="board-overlay" hidden>
        <div class="promo-card">
          <p class="paused-title">Paused</p>
          <button class="primary" id="btn-resume">Resume</button>
        </div>
      </div>
    </div>

    <div class="player" id="p-bottom">
      <div class="pinfo">
        <div class="pname"></div>
        <div class="pcap"></div>
      </div>
      <button class="clock" type="button"><span class="ctime"></span><span class="ctap">TAP</span></button>
    </div>

    <div id="side">
      <div id="status"></div>
      <div id="controls">
        <button data-act="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5"/></svg><span>Home</span></button>
        <button data-act="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
        <button data-act="undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4.5 12H15a5 5 0 0 1 0 10h-2"/></svg><span>Undo</span></button>
        <button data-act="flip"><svg viewBox="0 0 24 24"><path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4m3.5 12.5L17 20l-3.5-3.5"/></svg><span>Flip</span></button>
        <button data-act="hint" data-only="bot"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
        <button data-act="pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>Pause</span></button>
        <button data-act="draw" data-only="pvp"><svg viewBox="0 0 24 24"><path d="M7 8h10M7 16h10"/></svg><span>Draw</span></button>
        <button data-act="resign"><svg viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg><span>Resign</span></button>
      </div>
      <div id="moves"></div>
    </div>
  </section>

  <!-- Dialog -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="modal-buttons"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
</body>
</html>
